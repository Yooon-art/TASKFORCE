yaml
name: 대회 일정 매일 업데이트
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 변경이 있으면 저장
        run: |
          git config user.name "taskforce-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || (git commit -m "대회 일정 업데이트" && git push)
